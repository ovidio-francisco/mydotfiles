set draw_borders outline
set viewmode miller
set column_ratios 5,7,24
set hidden_filter ^\.|\.(?:pyc|pyo|bak|swp)$|^lost\+found$|^__(py)?cache__$
set use_preview_script true
set automatically_count_files true
set open_all_images true

set preview_files true
set preview_directories true
set collapse_preview true

set preview_images true
set preview_images_method w3m
set confirm_on_delete always 
set sort natural
set sort_directories_first true

set dirname_in_tabs false
set mouse_enabled true

set sort_reverse false
set sort_case_insensitive true
set sort_unicode false

# set line_numbers relative 
# set relative_current_zero true 
# set one_indexed true 

set clear_filters_on_dir_change false
set save_tabs_on_exit false

set cd_tab_case sensitive
# set preview_max_size 0
set show_selection_in_titlebar true

# set hostname_in_titlebar true
set tilde_in_titlebar true
set max_history_size 20
set max_console_history_size 50


set save_console_history true
set draw_progress_bar_in_status_bar true
# set display_size_in_main_column true
# set display_size_in_status_bar true
# set display_free_space_in_status_bar true
set display_tags_in_all_columns true
set update_title true


# Be aware of version control systems and display information.
# set vcs_aware true

# State of the four backends git, hg, bzr, svn. The possible states are disabled, local, enabled.
set vcs_backend_git enabled
set vcs_backend_hg  disabled
set vcs_backend_bzr disabled
set vcs_backend_svn disabled

# Delay in seconds before displaying an image with the w3m method. Increase it in case of experiencing display corruption.
set w3m_delay 0.02

# Use a unicode "..." character to mark cut-off filenames?
set unicode_ellipsis false

# Show dotfiles in the bookmark preview box?
set show_hidden_bookmarks true

# Available by default: default, jungle, snow, solarized
# set colorscheme solarized


# Shorten the title if it gets long?  The number defines how many directories are displayed at once, 0 turns off this feature.
set shorten_title 3

# Try to keep so much space between the top/bottom border when scrolling:
set scroll_offset 8

# Flush the input after each key hit?  (Noticeable when ranger lags)
set flushinput true

# Padding on the right when there's no preview? This allows you to click into the space to run the file.
set padding_right true


# The delay that ranger idly waits for user input, in milliseconds, with a
# resolution of 100ms.  Lower delay reduces lag between directory updates but increases CPU load.
set idle_delay 2000

# When the metadata manager module looks for metadata, should it only look for a ".metadata.json" file in the current directory, 
# or do a deep search and check all directories above the current one as well?
set metadata_deep_search false

# Enable scroll wrapping - moving down while on the last item will wrap around to the top and vice versa.
set wrap_scroll false

# Set the global_inode_type_filter to nothing.  Possible options: d, f and l for directories, files and symlinks respectively.
set global_inode_type_filter

set freeze_files false


# ===================================================================
# == Command Aliases in the Console
# ===================================================================


map : console

alias e     edit
alias q     quit
alias q!    quit!
alias qa    quitall
alias qa!   quitall!
alias setl  setlocal

alias filter     scout -prts
alias find       scout -aets
alias mark       scout -mr
alias unmark     scout -Mr
alias search     scout -rs
alias search_inc scout -rts
alias travel     scout -aefklst

# ===================================================================
# == Define keys for the browser
# ===================================================================

map <C-c> abort
map <esc> change_mode normal
map ~ set viewmode!

map i display_file
map ? help
map W display_log
map w taskview_open
map S shell $SHELL


# map <C-p> chain console; eval fm.ui.console.history_move(-1)

# Change the line mode
map Mf linemode filename
map Mi linemode fileinfo
map Mm linemode mtime
map Mp linemode permissions
map Ms linemode sizemtime
map Mt linemode metatitle

# Tagging / Marking
# map t       tag_toggle
# map ut      tag_remove
# map "<any>  tag_toggle tag=%any
# map <Space> mark_files toggle=True

map v       mark_files toggle=True
map uv      mark_files val=False
map V       toggle_visual_mode
map uV      toggle_visual_mode reverse=True

# For the nostalgics: Midnight Commander bindings
map q exit
map <F2> rename_append
map <F3> display_file


map k          move up=1
map j          move down=1
map h          move left=1
map l          move right=1
map gg         move to=0
map G          move to=-1
map <C-D>      move down=1   pages=True
map <C-U>      move up=1     pages=True
map J          move down=0.5 pages=True
map K          move up=0.5 pages=True
map <DELETE>   shell trash %f
map D          shell trash %f
map tr         shell trash %f


# External Programs
map e  edit
map yp yank path
map yd yank dir
map yn yank name
map y. yank name_without_extension


# --- Copy, Cut Paste ---

map pp paste
map po paste overwrite=True
map pP paste append=True
map pO paste overwrite=True append=True

map dd cut
map ud uncut
map da cut mode=add
map dr cut mode=remove
map dt cut mode=toggle

map yy copy
map ya copy mode=add
map yr copy mode=remove
map yt copy mode=toggle


# Searching
map /  console search%space
map n  search_next
map N  search_next forward=False

# Tabs
map <C-n>     tab_new
map <C-w>     tab_close
map <TAB>     tab_move 1
map <S-TAB>   tab_move -1
map gt        tab_move 1
map gc        tab_close
map gT        tab_move -1
map gn        tab_new
map uq        tab_restore
map <a-1>     tab_open 1
map <a-2>     tab_open 2
map <a-3>     tab_open 3
map <a-4>     tab_open 4
map <a-5>     tab_open 5
map <a-6>     tab_open 6
map <a-7>     tab_open 7
map <a-8>     tab_open 8
map <a-9>     tab_open 9

# Sorting
map or set sort_reverse!
# map oz set sort=random
map os chain set sort=size;      set sort_reverse=False
map ob chain set sort=basename;  set sort_reverse=False
map on chain set sort=natural;   set sort_reverse=False
map om chain set sort=mtime;     set sort_reverse=False
map oc chain set sort=ctime;     set sort_reverse=False
map oa chain set sort=atime;     set sort_reverse=False
map ot chain set sort=type;      set sort_reverse=False
map oe chain set sort=extension; set sort_reverse=False

map od    set sort_directories_first!

# Settings
map zc    set collapse_preview!
map .     set show_hidden!


# Bookmarks
# map `<any>  enter_bookmark %any
# map '<any>  enter_bookmark %any
# map m<any>  set_bookmark %any
# map um<any> unset_bookmark %any

# map m<bg>   draw_bookmarks
# copymap m<bg>  um<bg> `<bg> '<bg>



# ===================================================================
# == Define keys for the console
# ===================================================================
# Note: Unmapped keys are passed directly to the console.

# Basic
cmap <tab>   eval fm.ui.console.tab()
cmap <s-tab> eval fm.ui.console.tab(-1)
cmap <ESC>   eval fm.ui.console.close()
cmap <CR>    eval fm.ui.console.execute()
cmap <C-l>   redraw_window


# Move around
cmap <up>    eval fm.ui.console.history_move(-1)
cmap <down>  eval fm.ui.console.history_move(1)
cmap <left>  eval fm.ui.console.move(left=1)
cmap <right> eval fm.ui.console.move(right=1)
cmap <home>  eval fm.ui.console.move(right=0, absolute=True)
cmap <end>   eval fm.ui.console.move(right=-1, absolute=True)

# Line Editing
cmap <backspace>  eval fm.ui.console.delete(-1)
cmap <delete>     eval fm.ui.console.delete(0)
cmap <C-v>        eval fm.ui.console.paste()


# ===================================================================
# == Pager Keybindings
# ===================================================================

# Movement
pmap  <down>      pager_move  down=1
pmap  <up>        pager_move  up=1
pmap  <left>      pager_move  left=4
pmap  <right>     pager_move  right=4
pmap  <home>      pager_move  to=0
pmap  <end>       pager_move  to=-1
pmap  <pagedown>  pager_move  down=1.0  pages=True
pmap  <pageup>    pager_move  up=1.0    pages=True
pmap  <C-d>       pager_move  down=0.5  pages=True
pmap  <C-u>       pager_move  up=0.5    pages=True

copypmap <UP>       k  <C-p>
copypmap <DOWN>     j  <C-n> <CR>
copypmap <LEFT>     h
copypmap <RIGHT>    l
copypmap <HOME>     g
copypmap <END>      G
copypmap <C-d>      d
copypmap <C-u>      u
copypmap <PAGEDOWN> n  f  <C-F>  <Space>
copypmap <PAGEUP>   p  b  <C-B>

# Basic
# pmap     <C-l> redraw_window
pmap     <ESC> pager_close
copypmap <ESC> q Q i
pmap e      edit_file



# ===================================================================
# == Taskview Keybindings
# ===================================================================

# Movement
tmap <up>        taskview_move up=1
tmap <down>      taskview_move down=1
tmap <home>      taskview_move to=0
tmap <end>       taskview_move to=-1
tmap <pagedown>  taskview_move down=1.0  pages=True
tmap <pageup>    taskview_move up=1.0    pages=True
tmap <C-d>       taskview_move down=0.5  pages=True
tmap <C-u>       taskview_move up=0.5    pages=True

copytmap <UP>       k  <C-p>
copytmap <DOWN>     j  <C-n> <CR>
copytmap <HOME>     g
copytmap <END>      G
copytmap <C-u>      u
copytmap <PAGEDOWN> n  f  <C-F>  <Space>
copytmap <PAGEUP>   p  b  <C-B>


# Basic
tmap <ESC> taskview_close
copytmap <ESC> q Q w <C-c>



